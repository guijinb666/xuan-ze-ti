<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>选择题 · 人工智能基础素养</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f7f9; color: #1f2937; line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 8px 0 2px; }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 20px; color: #4f46e5; }
  .stats span { font-size: 12px; color: #6b7280; }
  .btn { display: block; width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-secondary { background: #eef2ff; color: #4f46e5; }
  .btn-ghost { background: #fff; color: #374151; border: 1px solid #e5e7eb; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .tag { display: inline-block; font-size: 12px; background: #eef2ff; color: #4f46e5; border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
  .q-stem { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 12px; background: #fff; font-size: 15px; margin-bottom: 10px; cursor: pointer; }
  .opt .key { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 1px; }
  .opt.sel { border-color: #4f46e5; background: #eef2ff; }
  .opt.sel .key { background: #4f46e5; color: #fff; border-color: #4f46e5; }
  .opt.correct { border-color: #16a34a; background: #f0fdf4; }
  .opt.correct .key { background: #16a34a; color: #fff; border-color: #16a34a; }
  .opt.wrong { border-color: #dc2626; background: #fef2f2; }
  .opt.wrong .key { background: #dc2626; color: #fff; border-color: #dc2626; }
  .nav { display: flex; gap: 10px; margin-top: 6px; }
  .nav .btn { margin-bottom: 0; }
  .progress { height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 10px 0 16px; }
  .progress i { display: block; height: 100%; background: #4f46e5; }
  .score { text-align: center; padding: 10px 0 4px; }
  .score b { font-size: 44px; color: #4f46e5; }
  .review { border-top: 1px solid #f3f4f6; padding-top: 14px; margin-top: 14px; }
  .review .ans { font-size: 14px; margin: 6px 0; }
  .review .ans .ok { color: #16a34a; font-weight: 600; }
  .review .ans .bad { color: #dc2626; font-weight: 600; }
  .expl { background: #f9fafb; border-left: 3px solid #4f46e5; border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 14px; color: #374151; margin-top: 8px; }
  .expl b { display: block; font-size: 13px; color: #4f46e5; margin-bottom: 2px; }
  .muted { color: #6b7280; font-size: 13px; }
  .empty { text-align: center; color: #6b7280; padding: 30px 0; }
  .foot { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 24px; }
  .rowbtns { display: flex; gap: 10px; }
  .rowbtns .btn { margin-bottom: 0; }
  .small { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="questions.js"></script>
<script>
(function () {
  var QS = window.QUIZ_QUESTIONS || [];
  var LS = { stats: 'xzt_stats', wrong: 'xzt_wrong', unique: 'xzt_unique' };
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function byId(id) { for (var i = 0; i < QS.length; i++) if (QS[i].id === id) return QS[i]; return null; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  var state = { view: 'home', quiz: null, idx: 0, result: null };

  function stats() { return load(LS.stats, { attempts: 0, best: 0, bestTotal: 15, last: null, lastTotal: 15 }); }
  function wrongBook() { return load(LS.wrong, {}); }
  function uniqueState() { return load(LS.unique, { cycle: 1, drawn: [] }); }

  function drawRandom(n) { return shuffle(QS.map(function (q) { return q.id; })).slice(0, n); }
  function drawUnique(n) {
    var u = uniqueState();
    var remaining = QS.map(function (q) { return q.id; }).filter(function (id) { return u.drawn.indexOf(id) === -1; });
    var picked = [];
    while (picked.length < n) {
      if (!remaining.length) { u.cycle += 1; u.drawn = []; remaining = shuffle(QS.map(function (q) { return q.id; })); }
      var take = shuffle(remaining).slice(0, n - picked.length);
      picked = picked.concat(take);
      u.drawn = u.drawn.concat(take);
      remaining = remaining.filter(function (id) { return take.indexOf(id) === -1; });
    }
    save(LS.unique, u);
    return picked;
  }

  function startQuiz(mode) {
    var ids = mode === 'unique' ? drawUnique(15) : (mode === 'wrong' ? shuffle(Object.keys(wrongBook()).map(Number)).slice(0, 15) : drawRandom(15));
    state.quiz = { mode: mode, ids: ids, answers: {}, done: false };
    state.idx = 0; state.result = null; state.view = 'quiz';
    render();
  }

  function submitQuiz() {
    var q = state.quiz, correct = 0, wrong = wrongBook();
    q.ids.forEach(function (id) {
      var item = byId(id), a = q.answers[id];
      if (a === item.answer) { correct++; delete wrong[id]; } else { wrong[id] = a || ''; }
    });
    save(LS.wrong, wrong);
    var s = stats();
    s.attempts += 1; s.last = correct; s.lastTotal = q.ids.length;
    if (correct > s.best) { s.best = correct; s.bestTotal = q.ids.length; }
    save(LS.stats, s);
    state.result = { score: correct, total: q.ids.length };
    state.view = 'result';
    render();
  }

  function homeHTML() {
    var s = stats(), w = wrongBook(), u = uniqueState();
    var wCount = Object.keys(w).length;
    return '<h1>选择题</h1>' +
      '<p class="sub">人工智能基础素养 · 共 280 道单选（人工智能专题 51 道 / 信息技术基础专题 229 道）<br>解析已全部内置，点开即看，不用等待。</p>' +
      '<div class="card"><div class="stats">' +
      '<div><b>' + s.attempts + '</b><span>练习次数</span></div>' +
      '<div><b>' + (s.attempts ? s.best + '/' + s.bestTotal : '—') + '</b><span>最好成绩</span></div>' +
      '<div><b>' + (s.last == null ? '—' : s.last + '/' + s.lastTotal) + '</b><span>上次成绩</span></div>' +
      '<div><b>' + wCount + '</b><span>错题</span></div>' +
      '</div></div>' +
      '<button class="btn btn-primary" onclick="startQuiz(\'random\')">随机练习 · 15 道</button>' +
      '<button class="btn btn-secondary" onclick="startQuiz(\'unique\')">不重复练习 · 15 道</button>' +
      '<p class="muted small" style="margin:-4px 0 10px">不重复模式：第 ' + u.cycle + ' 轮，本轮已抽 ' + u.drawn.length + ' / 280 道，抽完一轮自动开启下一轮。</p>' +
      '<button class="btn btn-ghost" onclick="showWrong()">错题本' + (wCount ? '（' + wCount + ' 道）' : '') + '</button>' +
      '<p class="foot">题库来自《人工智能基础素养》单选题，标红选项为正确答案。<br>练习记录只保存在本机浏览器里。</p>';
  }

  function quizHTML() {
    var q = state.quiz, id = q.ids[state.idx], item = byId(id);
    var answered = q.ids.filter(function (x) { return q.answers[x]; }).length;
    var opts = item.options.map(function (o) {
      var sel = q.answers[id] === o.label ? ' sel' : '';
      return '<button class="opt' + sel + '" onclick="choose(' + id + ',\'' + o.label + '\')"><span class="key">' + o.label + '</span><span>' + esc(o.text) + '</span></button>';
    }).join('');
    return '<p class="muted">第 ' + (state.idx + 1) + ' / ' + q.ids.length + ' 题 · 已答 ' + answered + ' 道</p>' +
      '<div class="progress"><i style="width:' + Math.round(answered / q.ids.length * 100) + '%"></i></div>' +
      '<div class="card"><span class="tag">' + esc(item.section) + '</span>' +
      '<div class="q-stem">' + esc(item.stem) + '</div>' + opts + '</div>' +
      '<div class="nav">' +
      '<button class="btn btn-ghost" ' + (state.idx === 0 ? 'disabled' : '') + ' onclick="move(-1)">上一题</button>' +
      (state.idx < q.ids.length - 1
        ? '<button class="btn btn-primary" onclick="move(1)">下一题</button>'
        : '<button class="btn btn-primary" ' + (answered < q.ids.length ? 'disabled' : '') + ' onclick="submitQuiz()">交卷（' + answered + '/' + q.ids.length + '）</button>') +
      '</div>' +
      '<button class="btn btn-ghost" style="margin-top:10px" onclick="quitQuiz()">退出本次练习</button>';
  }

  function reviewCard(item, mine) {
    var right = mine === item.answer;
    var opts = item.options.map(function (o) {
      var cls = o.label === item.answer ? ' correct' : (o.label === mine ? ' wrong' : '');
      return '<div class="opt' + cls + '" style="cursor:default"><span class="key">' + o.label + '</span><span>' + esc(o.text) + '</span></div>';
    }).join('');
    return '<div class="review"><span class="tag">' + esc(item.section) + '</span>' +
      '<div class="q-stem">' + esc(item.stem) + '</div>' + opts +
      '<p class="ans">你的选择：<span class="' + (right ? 'ok' : 'bad') + '">' + (mine ? mine : '未作答') + '</span>　正确答案：<span class="ok">' + item.answer + '</span></p>' +
      '<div class="expl"><b>解析</b>' + esc(item.explanation || '暂无解析') + '</div></div>';
  }

  function resultHTML() {
    var r = state.result, q = state.quiz;
    var cards = q.ids.map(function (id) { return reviewCard(byId(id), q.answers[id]); }).join('');
    return '<div class="card"><div class="score"><b>' + r.score + ' / ' + r.total + '</b><p class="muted">本次得分</p></div></div>' +
      '<div class="card">' + cards + '</div>' +
      '<button class="btn btn-primary" onclick="startQuiz(\'' + q.mode + '\')">再练一组</button>' +
      '<button class="btn btn-ghost" onclick="goHome()">回首页</button>';
  }

  function wrongHTML() {
    var w = wrongBook(), ids = Object.keys(w).map(Number);
    if (!ids.length) return '<h1>错题本</h1><p class="sub">这里会收录你答错的题目，答对后自动移出。</p><div class="card empty">还没有错题，去练一组吧</div><button class="btn btn-ghost" onclick="goHome()">回首页</button>';
    var cards = ids.map(function (id) {
      var item = byId(id); if (!item) return '';
      return '<div class="card">' + reviewCard(item, w[id]) +
        '<button class="btn btn-ghost small" style="margin-top:10px" onclick="dropWrong(' + id + ')">已掌握，移出</button></div>';
    }).join('');
    return '<h1>错题本</h1><p class="sub">共 ' + ids.length + ' 道 · 答对后自动移出</p>' +
      '<button class="btn btn-primary" onclick="startQuiz(\'wrong\')">错题练习 · 最多 15 道</button>' + cards +
      '<button class="btn btn-ghost" onclick="goHome()">回首页</button>';
  }

  function render() {
    var el = document.getElementById('app');
    if (state.view === 'home') el.innerHTML = homeHTML();
    else if (state.view === 'quiz') el.innerHTML = quizHTML();
    else if (state.view === 'result') el.innerHTML = resultHTML();
    else if (state.view === 'wrong') el.innerHTML = wrongHTML();
    window.scrollTo(0, 0);
  }

  window.startQuiz = startQuiz;
  window.submitQuiz = submitQuiz;
  window.goHome = function () { state.view = 'home'; render(); };
  window.showWrong = function () { state.view = 'wrong'; render(); };
  window.choose = function (id, label) { state.quiz.answers[id] = label; render(); };
  window.move = function (d) { state.idx = Math.max(0, Math.min(state.quiz.ids.length - 1, state.idx + d)); render(); };
  window.quitQuiz = function () { if (confirm('确定退出本次练习吗？本次作答不会保存。')) { state.quiz = null; state.view = 'home'; render(); } };
  window.dropWrong = function (id) { var w = wrongBook(); delete w[id]; save(LS.wrong, w); render(); };

  if (!QS.length) document.getElementById('app').innerHTML = '<div class="card empty">题库加载失败，请刷新重试</div>';
  else render();
})();
</script>
</body>
</html>
